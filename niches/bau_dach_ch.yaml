# Auto-discovery: seed_discover.py appends new validated URLs.
search_queries:
  # ── Architekturbüros ────────────────────────────────────────────────────
  - "Architekturbüro Zürich Team Mitarbeiter Kontakt"
  - "Architekturbüro Bern Mitarbeitende Team"
  - "Architekturbüro Basel Luzern Team Kontakt"
  - "Architekt Innenausbau Sanierung Deutschschweiz Team"
  # ── General- / Totalunternehmer ─────────────────────────────────────────
  - "Generalunternehmer Deutschschweiz Hochbau Team Kontakt"
  - "Totalunternehmer Umbau Sanierung Schweiz Team Mitarbeitende"
  - "Generalunternehmung Wohnbau Zürich Bern Team"
  # ── Bauunternehmen (Hochbau) ────────────────────────────────────────────
  - "Bauunternehmen Hochbau Mittelland Team Mitarbeitende"
  - "Bauunternehmen Sanierung Umbau Aargau Solothurn Team"
  # ── Bauträger / Entwickler ──────────────────────────────────────────────
  - "Bauträger Immobilienentwicklung Deutschschweiz Team Kontakt"

discovery:
  max_seeds_per_run: 25
  search_country:    de          # DACH niche — German results
  require_mailto:    true
  require_keywords:
