# WHAT THIS NICHE SCRAPES
# Deutschschweiz B2B firms that hire a Maler-/Gipser SUBCONTRACTOR for the
# finishing phase of Neubau / Umbau / Sanierung projects — a DIFFERENT buying
# motion than property managers, so it has its own copy (f2-bau-default):
#   • Architekturbüros            (spec + recommend the trade on projects)
#   • General- / Totalunternehmer (subcontract the Maler/Gipser scope)
#   • Bauunternehmen (Hochbau)
#   • Bauträger / Immobilienentwickler
# Pain pitched: the Maler/Gipser part blowing the Bauprogramm, Nachträge, and
# Abnahme defects. Sends through F2's shared senders (news/send.aureonglobal.de).

seeds: []   # purely auto-discovered via seed_discover; no hand-curated seeds yet

  # auto-discovered 2026-05-30 08:01 via seed_discover.py
