# scrape-time ICP gate (lead_scrape.py): EVERY seed page — auto-discovered or
# hand-added — must contain one of these terms or the seed is skipped before any
# lead is extracted. This is the chokepoint the Real Madrid fan site slipped
# past (it matched "real" upstream but carries none of these on-page).
seed_require_keywords: ["real estate", "realtor", "realty", "brokerage", "mls", "homes for sale", "listing"]

discovery:
  max_seeds_per_run: 15
  search_country:    us          # Brave/ddgs region — US brokerages (was defaulting to de-de)
  require_mailto:    true
  # Page must contain a real-estate-SPECIFIC term. The old list ("agent",
  # "broker") was too generic — football clubs ("player agent"), supermarkets,
  # insurance/mortgage/freight brokers all matched. These four are unambiguous
  # real-estate signals a non-real-estate site won't carry.
  require_keywords:  ["real estate", "realtor", "realty", "brokerage"]
  exclude_domains:
    - facebook.com
    - linkedin.com
    - zillow.com
    - realtor.com
    - redfin.com
    - trulia.com
    - youtube.com
    - twitter.com
    - x.com
    - instagram.com
    - tiktok.com
    - reddit.com
    - yelp.com
    - bbb.org
    # Microsoft marketplace pages injected a cluster of SaaS/tech vendors
    # (iGlobe, Cognite, Fivetran, IBM...) on a fuzzy match. Never a RE seed.
    - marketplace.microsoft.com
    - microsoft.com
    - azuremarketplace.microsoft.com

filter:
  # Skip generic role mailboxes — campaigns need individuals.
  exclude_local_parts:
    - info
    - contact
    - hello
    - sales
    - admin
    - support
    - office
    - team
    - marketing
    - recruiting
    - press
    - jobs
  exclude_domains:
    # Peer / competitor brokerages — sophisticated lead-gen recruiting teams that
    # SELL this capability themselves; wrong-fit for the Listing Engine pitch.
    - teamminik.com
    # Non-ICP contamination caught in the 2026-06 lead audit: "Real Madrid" got
    # scraped on a fuzzy "real" match (fan-club corp inboxes, not real estate),
    # plus a stray German site. Block so they never re-enter the pool.
    - realmadrid.com
    - corp.realmadrid.com
    - weltmonarch.de
    # Tech/SaaS vendors scraped off Microsoft marketplace pages, mortgage lenders
    # (we target real-estate AGENTS, not lenders), and a newspaper — 2026-06 deep
    # targeting purge. All were verified=true and actively being emailed.
    - iglobe.dk
    - cognite.com
    - fivetran.com
    - maqsoftware.com
    - ema.ai
    - cisecurity.org
    - independent.com
    - ibm.com
    - cnnmortgage.com
    - novahomeloans.com

# What sequence to run for verified leads from this niche.
# Edit step copy in sequences/aureon-realestate-us/variants.json — those
# 7 variant entries are the canonical source for subject + body. Edit
# step CADENCE (delay_days) below if you want to retime the drip.
sequence:
  variants_file: sequences/aureon-realestate-us/variants.json
  forced_persona: daniel
  steps:
    - { step_n: 1, variant_n: 1, delay_days: 0 }   # intro + proof
    - { step_n: 2, variant_n: 2, delay_days: 3 }   # soft bump
    - { step_n: 3, variant_n: 3, delay_days: 4 }   # data point (5-min rule)
    - { step_n: 4, variant_n: 4, delay_days: 5 }   # specific case study
    - { step_n: 5, variant_n: 5, delay_days: 6 }   # blunt ask
    - { step_n: 6, variant_n: 6, delay_days: 7 }   # low-risk pilot
    - { step_n: 7, variant_n: 7, delay_days: 7 }   # breakup
