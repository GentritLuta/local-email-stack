slug: real_estate_us
name: "US Real Estate Agents — independent brokerages"
profile_slug: aureon
engine: team_pages

# Copy greets by {greeting} (first name when known, else "{company} team"), so a
# parseable first name is NOT required — don't drop brokerage leads (incl.
# front-desk info@/office@ inboxes) just because the email carries no name.
require_first_name: false

# Google Maps / Places source (places_scrape.py). Brokerages live on Google
# Business Profiles; Places returns the agency name + city directly. The
# categories x cities space is rotated by the .places.done cursor.
places:
  country: us
  max_per_query: 20
  categories:
    - "real estate agency"
    - "real estate brokerage"
    - "realtor"
  cities:
    - "Austin TX"
    - "Dallas TX"
    - "Houston TX"
    - "Phoenix AZ"
    - "Denver CO"
    - "Atlanta GA"
    - "Charlotte NC"
    - "Tampa FL"
    - "Orlando FL"
    - "Nashville TN"
    - "Columbus OH"
    - "Indianapolis IN"
    - "Kansas City MO"
    - "Las Vegas NV"
    - "Salt Lake City UT"
    - "Seattle WA"
    - "Portland OR"
    - "Minneapolis MN"
    - "St Louis MO"
    - "San Antonio TX"

# WHAT THIS NICHE DOES
# Walks the seed URLs below, extracts every mailto: link with its surrounding
# context (name, role, phone), verifies each address (syntax + disposable +
# MX + SMTP probe + catch-all check), and upserts only the addresses that
# survive into Supabase `prospects`. Only verified rows reach a campaign.
#
# RUN
#   py sequences/lead_scrape.py run real_estate_us
#
# SCHEDULE (daily 08:30 local)
#   schtasks /Create /TN "LES-lead-scrape-real_estate_us" /SC DAILY /ST 08:30 ^
#     /TR "py C:\Users\bernh\local-email-stack\sequences\lead_scrape.py run real_estate_us"

