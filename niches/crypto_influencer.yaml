slug: crypto_influencer
name: "Crypto + trading editorial / research / community contacts"
profile_slug: algoalpha
engine: team_pages

# WHAT THIS NICHE SCRAPES
# Public team pages, contributor lists, and contact pages of crypto media
# outlets, research desks, and DAO/community sites. These are the audiences
# most likely to engage with AlgoAlpha's product (TradingView indicators +
# crypto signals): journalists writing on trading + on-chain, research
# analysts at think-tanks, community leaders running TA workshops.
#
# THIS IS A REAL TEST RUN — emails extracted go to Supabase prospects with
# verified=mx_verified (or smtp_verified where port 25 is reachable).
# No sends happen from scraping alone; that's a separate enqueue step.
#
# RUN
#   py sequences/lead_scrape.py run crypto_influencer
#
# SCHEDULE (daily 09:00)
#   schtasks /Create /TN "LES-lead-scrape-crypto_influencer" /SC DAILY /ST 09:00 ^
#     /TR "py C:\Users\bernh\local-email-stack\sequences\lead_scrape.py run crypto_influencer"

seeds:
  # Crypto editorial team / author pages. Mix of static (mailto: cards) and
  # SSR (Next.js / Nuxt JSON blobs) — the scraper handles both.
  - https://decrypt.co/team
  - https://decrypt.co/authors
  - https://www.theblock.co/about
  - https://www.theblock.co/people
  - https://bitcoinmagazine.com/about
  - https://thedefiant.io/about
  - https://thedefiant.io/team
  - https://www.coindesk.com/about
  - https://blockworks.co/team
  - https://protos.com/about-us
  - https://www.cryptobriefing.com/about
  - https://cryptoslate.com/about

  # Research + intelligence desks
  - https://messari.io/about
  - https://www.tokeninsight.com/en/about-us
  - https://kaiko.com/about

  # Newsletter authors + community leaders
  - https://www.bankless.com/about
  - https://www.coinage.media/team
  - https://www.unchainedcrypto.com/about

  # Open contact / press pages
  - https://cointelegraph.com/contact-us
  - https://cointelegraph.com/about

filter:
  # Skip role mailboxes — campaigns target individuals, not info@/contact@.
  exclude_local_parts:
    - info
    - contact
    - hello
    - sales
    - admin
    - support
    - office
    - team
    - marketing
    - press
    - jobs
    - careers
    - editor
    - newsdesk
    - newsroom
    - tips
    - pitch
    - advertising
    - partnerships
  # No domain exclusions — even @gmail.com personal emails for influencers
  # are legitimate targets, just lower-confidence than corporate addresses.
  exclude_domains: []

# What sequence to run on verified leads from this niche.
# (No sequence row in Supabase yet — author one before enqueuing.)
sequence:
  variants_file: sequences/universal-pitch/variants.json
  forced_persona: tomas
  steps:
    - { step_n: 1, variant_n: 1, delay_days: 0 }
