filter:
  # Skip role mailboxes — outreach targets named persons, not info@/kontakt@.
  # Heavier list than crypto_influencer because German-language sites use
  # more language-specific role addresses (Verwaltung, Bewirtschaftung,
  # Sekretariat, Buchhaltung etc.).
  exclude_local_parts:
    - info
    - kontakt
    - contact
    - hello
    - mail
    - sekretariat
    - empfang
    - reception
    - verwaltung
    - bewirtschaftung
    - liegenschaften
    - immobilien
    - buchhaltung
    - finanzen
    - rechnungswesen
    - support
    - service
    - hotline
    - bewerbung
    - jobs
    - karriere
    - hr
    - marketing
    - presse
    - medien
    - news
    - newsletter
    - werbung
    - offerte
    - angebote
    - office
    - admin
    - sales
  exclude_domains:
    - f2-malergipser.ch          # client's own brand
    - www.f2-malergipser.ch
    - aureonglobal.de            # sender infra
    - www.aureonglobal.de

# Auto-discovery: seed_discover.py runs daily, appends new validated URLs.
# Queries span the adjacent B2B categories that commission Maler/Gipser work
# across the Deutschschweiz (F2's actual service area per its tagline), not
# just Bern property managers. Each category is a real buyer of repeating
# painting/plastering jobs.
search_queries:
  # All categories below share the SAME buying motion the F2 step-1 copy is
  # written for: recurring tenant-turnover + building-renovation work
  # (Wohnungsabnahmen, Treppenhaus, Fassade). Geography widened from Bern to
  # the whole Deutschschweiz — F2's actual service area — which is the biggest
  # supply lever and carries zero message-relevance risk.
  # ── Property / real-estate management (core) — Bern region ──────────────
  - "Liegenschaftsverwaltung Bern Team Mitarbeiter Kontakt"
  - "Immobilienverwaltung Bern Bewirtschafter Mitarbeitende"
  - "Liegenschaftsverwaltung Burgdorf Emmental Team"
  - "Liegenschaftsverwaltung Oberaargau Langenthal Team"
  - "Verwaltung Stockwerkeigentum Bern Kontakt Team"
  - "Liegenschaftsverwaltung Thun Spiez Team"
  # ── Property management — wider Deutschschweiz (same motion, new cities) ─
  - "Immobilienbewirtschaftung Zürich Team Mitarbeitende Kontakt"
  - "Liegenschaftsverwaltung Basel Bewirtschaftung Team"
  - "Immobilienverwaltung Luzern Zug Team Mitarbeitende"
  - "Liegenschaftsverwaltung Aargau Solothurn Team Kontakt"
  - "Immobilienbewirtschaftung St. Gallen Winterthur Team"
  # ── Hausverwaltung / STWEG (identical motion to property mgmt) ──────────
  - "Hausverwaltung STWEG Bewirtschaftung Deutschschweiz Team"
  # ── Real-estate Treuhand WITH Bewirtschaftung (do tenant turnovers) ─────
  - "Immobilientreuhand Bewirtschaftung Mietwohnungen Deutschschweiz Team"
  # ── Housing cooperatives (own + turn over large rental stock) ───────────
  - "Wohnbaugenossenschaft Geschäftsstelle Bewirtschaftung Team Kontakt"
  - "Baugenossenschaft Deutschschweiz Mietwohnungen Verwaltung Team"
  # ── Facility management / building upkeep (recurring renovation budget) ─
  - "Facility Management Liegenschaften Gebäudeunterhalt Deutschschweiz Team"
  - "Liegenschaftenunterhalt Bewirtschaftung Mietliegenschaften Team Kontakt"

