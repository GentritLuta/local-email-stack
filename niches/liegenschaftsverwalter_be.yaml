name: "Deutschschweiz property-renovation buyers — Verwaltung, Genossenschaften, Facility Mgmt, Treuhand"
profile_slug: f2-malergipser
engine: team_pages   # default for plain string seeds

# WHAT THIS NICHE SCRAPES
# Deutschschweiz firms that commission RECURRING tenant-turnover + building-
# renovation painter/plasterer work (Wohnungsabnahmen, Treppenhaus, Fassade,
# Schimmel) — exactly the motion F2's step-1 cold-email copy is written for.
# Started as Bern property managers; extended along two axes:
#   1. CATEGORIES (same buying motion as property mgmt):
#        • Liegenschafts-/Immobilienverwaltung & Bewirtschaftung   (core)
#        • Hausverwaltung / STWEG-Verwaltung
#        • Wohnbaugenossenschaften                  (own + turn over rental stock)
#        • Facility Management / Gebäudeunterhalt    (building-maintenance budgets)
#        • Immobilien-Treuhand MIT Bewirtschaftung   (do tenant turnovers)
#   2. GEOGRAPHY: Bern region -> whole Deutschschweiz (F2's real service area:
#      Zürich, Basel, Luzern, Zug, Aargau, Solothurn, St. Gallen, Winterthur).
# DELIBERATELY EXCLUDED (hire the trade but a DIFFERENT pitch — would need a
# new copy variant first): architects, general/total contractors, property
# developers, pure brokerage-only, Hauswart-only.
#
# All 21 seeds below were WebFetch-validated as live Swiss property
# managers actively running rental + STWEG portfolios in the target
# region. Firms whose primary business is brokerage (Verkauf), construction
# (Bau), or Hauswart-only services were rejected. Out-of-region firms
# (Biel, Thun, Luzern) were rejected.
#
# Each seed can be either:
#   - "url"                          → uses niche-level engine
#   - { url: "...", engine: "..." }  → per-seed engine override
#
# Engines:
#   - team_pages  : httpx fetch + bs4 (fast; auto-upgrades to playwright if static HTML is empty)
#   - playwright  : full Chrome render (JS, SPA, soft Cloudflare). ~3-5s/seed.
#
# RUN
#   py sequences/lead_scrape.py run liegenschaftsverwalter_be
#   py sequences/lead_scrape.py run liegenschaftsverwalter_be --engine playwright  # force-all
#
# SCHEDULE (weekly Mon 09:00 — small niche, weekly is enough)
#   schtasks /Create /TN "LES-lead-scrape-liegenschaftsverwalter_be" /SC WEEKLY /D MON /ST 09:00 ^
#     /TR "py C:\Users\bernh\local-email-stack\sequences\lead_scrape.py run liegenschaftsverwalter_be"

