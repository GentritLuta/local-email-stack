  - { url: "https://www.median-kliniken.de/de/unternehmen/kontakt/", company: "MEDIAN Kliniken",   city: "Berlin" }

  # ── IT-Dienstleister Mittelstand (inhabergeführt, Team-Seiten mit Kontakten) ──
