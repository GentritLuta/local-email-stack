slug: atal_dach_b2b
name: "DACH B2B Mittelstand — Präventionsseminare (Atal SolidRocks)"
profile_slug: atalsolidrocks
engine: team_pages   # httpx + bs4, auto-upgrades to playwright if static HTML is empty

# WHAT THIS NICHE SCRAPES
# Mid-market DACH companies in HIGH-Krankenstand sectors (Industrie/Maschinenbau,
# Gesundheit & Pflege, plus mid-market IT) — the ICP from atalsolidrocks.com:
# HR-, BGM- und Geschäftsführungs-Entscheider in Firmen mit ~50–150+ Mitarbeitenden.
#
# STARTER seeds are real named firms; expand via seed_discover (now multi-backend,
# keyword-gated below). lead_scrape --no-smtp validates yield; prune dead pages.

seeds:
  # ── Industrie / Maschinenbau ──
  - { url: "https://www.ziehl-abegg.com/de-de/kontakt",        company: "Ziehl-Abegg SE",          city: "Künzelsau" }
  - { url: "https://www.iwis.com/de/kontakt/",                 company: "iwis SE & Co. KG",        city: "München" }
  - { url: "https://www.hengst.com/de/kontakt/",               company: "Hengst SE",               city: "Münster" }
  - { url: "https://www.obo.de/de/kontakt/",                   company: "OBO Bettermann",          city: "Menden" }
  - { url: "https://www.lohmann-tapes.com/de/kontakt/",        company: "Lohmann GmbH & Co. KG",   city: "Neuwied" }
  - { url: "https://www.bizerba.com/de-de/kontakt/",           company: "Bizerba SE & Co. KG",     city: "Balingen" }

  # ── Gesundheit & Pflege ──
