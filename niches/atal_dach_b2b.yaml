# Discovery: seed_discover.py cycles Bing/Brave/Google/Mojeek (region de-de) for each
# query, then keeps only pages that have a mailto: AND at least one ICP keyword.
# This gates out the news/SaaS/app-store noise generic searches return.

discovery:
  max_seeds_per_run: 15
  require_mailto: true
  require_keywords:
    - geschäftsführer
    - geschäftsführung
    - personal
    - personalleitung
    - gesundheit
    - pflege
    - produktion
    - werkleiter
    - mitarbeiter
    - team

# Auto-discovery DISABLED for this niche: web search returns irrelevant noise for
# this ICP (HR/Geschäftsführung decision-makers don't surface via generic search).
# Renamed so seed_discover skips it. Feed this niche from a purchased contact list
# or LinkedIn export instead. Re-enable by renaming back to `search_queries`.
_search_queries_disabled:
  - "mittelständische Pflegedienst GmbH team \"@\" kontakt"
  - "Produktionsbetrieb Mittelstand Geschäftsführung team \"@\""
  - "ambulanter Pflegedienst Geschäftsführung E-Mail kontakt"
  - "Logistik Spedition Mittelstand team Geschäftsführer kontakt"

# Filter rules applied during lead_scrape extraction.
filter:
  exclude_local_parts:
    - info
    - contact
    - kontakt
    - support
    - office
    - admin
    - sales
    - vertrieb
    - hello
    - hi
    - press
    - presse
    - noreply
    - no-reply
    - postmaster
    - datenschutz
    - karriere
    - jobs
    - bewerbung
    - newsletter
    - marketing
  exclude_domains:
    - example.com
    - example.de
    - example.org
    - domain.de
    - domain.com
    - beispiel.de
    - gmail.com
    - yahoo.de
    - hotmail.de
    - web.de
    - gmx.de
    - gmx.net
    - google.com
