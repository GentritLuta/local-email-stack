seed_require_keywords: ["real estate", "realtor", "realty", "brokerage", "mls", "homes for sale", "listing"]

discovery:
  max_seeds_per_run: 15
  search_country:    us
  require_mailto:    true
  require_keywords:  ["real estate", "realtor", "realty", "brokerage"]
  exclude_domains:
    - facebook.com
    - linkedin.com
    - zillow.com
    - realtor.com
    - redfin.com
    - trulia.com
    - youtube.com
    - twitter.com
    - x.com
    - instagram.com
    - tiktok.com
    - reddit.com
    - yelp.com
    - bbb.org
    - marketplace.microsoft.com
    - microsoft.com
    - azuremarketplace.microsoft.com

filter:
  exclude_local_parts:
    - info
    - contact
    - hello
    - sales
    - admin
    - support
    - office
    - team
    - marketing
    - recruiting
    - press
    - jobs
  exclude_domains:
    # Aureon runs its OWN realtor pipeline (real_estate_us). Exclude Aureon's own
    # infra + peer recruiters so LK and Aureon don't email each other / overlap.
    - teamminik.com
    - aureonglobal.de
    - lk-advertising.site
    - lk-advertising.com
    - weltmonarch.de
    - realmadrid.com
    - corp.realmadrid.com

# LK's own sequence (LK runs the paid media + delivers booked appointments; books to
# cal.com/lkadvertising/15min). Distinct from aureon-realestate-us (which is the
# 30/70-commission-split call-center model). Edit copy in the variants file.
sequence:
  variants_file: sequences/lk-advertising-default/variants.json
  forced_persona: lukas
  steps:
    - { step_n: 1, variant_n: 1, delay_days: 0 }
    - { step_n: 2, variant_n: 2, delay_days: 2 }
    - { step_n: 3, variant_n: 3, delay_days: 2 }
    - { step_n: 4, variant_n: 4, delay_days: 3 }
    - { step_n: 5, variant_n: 5, delay_days: 4 }
    - { step_n: 6, variant_n: 6, delay_days: 7 }
    - { step_n: 7, variant_n: 7, delay_days: 10 }
