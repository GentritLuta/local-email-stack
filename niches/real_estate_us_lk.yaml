# LK Advertising's US-Realtor ICP (per Lukas Koehler's onboarding form, 2026-06-06).
# Same lead UNIVERSE as the proven real_estate_us niche (independent US brokerage
# team pages with named agents + personal emails), but bound to the lk-advertising
# profile and LK's own sequence. We reuse the hard-won seed list + ICP gate from
# real_estate_us so LK gets a working lead source on day one instead of starting
# discovery from scratch. seed_discover.py will keep appending fresh seeds for both.

# Copy greets by {greeting}/{first_name}; a parseable first name is NOT required.
require_first_name: false

# Google Maps / Places source (places_scrape.py). Same local-brokerage universe
# as real_estate_us; LK's cross-brand dedup keeps it from re-emailing aureon's
# contacts at enroll time, so sharing the Places categories is safe. Different
# city set than aureon to spread coverage.
places:
  country: us
  max_per_query: 20
  categories:
    - "real estate agency"
    - "real estate brokerage"
    - "realtor"
  cities:
