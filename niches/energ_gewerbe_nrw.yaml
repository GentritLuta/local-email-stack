    - dasoertliche.de
    - wlw.de
    - europages.de
    - 11880.com
    - meinestadt.de
    - kununu.com
    - indeed.com
    - stepstone.de
    # Energy vendors / utilities / competitors — off-ICP (we are the independent
    # consultant; do not pitch other consultants or the utilities themselves).
    - eon.de
    - eon.com
    - rwe.com
    - rwe.de
    - vattenfall.de
    - enbw.com
    - stadtwerke
    - swd-ag.de
    - check24.de
    - verivox.de
    # Directory / aggregator (wrong-region noise — hamburg.de branchenbuch).
    - hamburg.de
    # Impressum legal-boilerplate sources: German Impressum pages link out to a
    # privacy lawyer, the chamber of crafts, the state data-protection authority,
    # arbitration boards and trade media. The scraper grabs those addresses as if
    # they were the company. Block them at discovery so they never seed.
    - datenschutz-neuss.de
    - ldi.nrw.de
    - hwk-koeln.de
    - hwk-duesseldorf.de
    - verbraucher-schlichter.de
    - dvs-media.info
    - marketingflotte.ai

filter:
  # Skip generic role mailboxes where possible — ENER-G copy hard-requires a
  # {first_name}. Note: German Impressum often only exposes info@/kontakt@ even
  # when it names the GF in text; the backfill step pairs the named GF with the
  # address. Keep this list short so we don't drop the only address a small
  # Betrieb publishes.
  exclude_local_parts:
    - newsletter
    - presse
    - jobs
    - bewerbung
    - karriere
    - datenschutz
    - webmaster
    - marketing
    - support
  exclude_domains:
    # Utilities / energy vendors / competitors that slip past the page gate.
    - eon.de
    - rwe.de
    - vattenfall.de
    - enbw.com
    - check24.de
    - verivox.de
    # Impressum legal-boilerplate + directory + off-ICP caught in the 2026-06-09
    # first scrape (privacy lawyer, chamber of crafts, NRW data authority,
    # arbitration board, trade media, AI marketing vendor, Hamburg directory,
    # low-consumption hotels / YMCA). Never email these.
    - datenschutz-neuss.de
    - ldi.nrw.de
    - hwk-koeln.de
    - verbraucher-schlichter.de
    - dvs-media.info
    - marketingflotte.ai
    - team.hamburg.de
    - hamburg.de
    - city-hotels.co
    - cvjm-duesseldorf.de
    - hogri.de
    # 2nd-pass contaminants (2026-06-09 eve): associations/institutes/authorities/
    # arbitration/utilities/agencies + a UC vendor. Not energy-buying Betriebe.
    - kunststoffland-nrw.de
    - kunststoff-institut.de
    - schlichtungsstelle-energie.de
    - bnetza.de
    - medl.de
    - qmarketing.de
    - xvoice-uc.de
    - kuehlhaus-zentrum.de
