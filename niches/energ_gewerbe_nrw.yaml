# scrape-time ICP gate (lead_scrape.py): EVERY seed page must contain one of
# these terms or the seed is skipped before any lead is extracted. These signal
# a real producing/energy-using Gewerbe (not an agency, shop-only, or utility).
seed_require_keywords:
  - "Produktion"
  - "Fertigung"
  - "Herstellung"
  - "Werk"
  - "Industrie"
  - "Maschinen"
  - "Metall"
  - "Kunststoff"
  - "Lebensmittel"
  - "Logistik"
  - "Kühl"
  - "Gießerei"
  - "Galvanik"
  - "Druckerei"
  - "Bäckerei"
  - "Hotel"
  - "Produktions"
  - "Geschäftsführer"

discovery:
  max_seeds_per_run: 15
  search_country:    de          # German results
  require_mailto:    true
  require_keywords:
    - "Produktion"
    - "Fertigung"
    - "Herstellung"
    - "Industrie"
    - "Metall"
    - "Kunststoff"
    - "Lebensmittel"
    - "Logistik"
    - "Maschinen"
    - "Gießerei"
    - "Galvanik"
    - "Druckerei"
    - "Geschäftsführer"
    - "Impressum"
  exclude_domains:
    - facebook.com
    - linkedin.com
    - xing.com
    - youtube.com
    - twitter.com
    - x.com
    - instagram.com
    - tiktok.com
    - reddit.com
    - yelp.com
    - wikipedia.org
