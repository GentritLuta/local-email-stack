slug: energ_gewerbe_nrw
name: "ENER-G — energieintensives KMU/Gewerbe in NRW (~100 km um Neuss/Düsseldorf, ab 30.000 kWh)"
profile_slug: energ
engine: team_pages   # httpx + bs4, auto-upgrade to playwright on empty static HTML

# Greeting falls back to "{company} team"/Sie-Anrede, but ENER-G copy hard-requires
# {first_name} (Pflicht-Merge). German Impressum pages almost always name the GF, so
# keep first-name extraction on; the backfill/synthesis fills {first_name} from the
# Impressum "Geschäftsführer" line where the mailto context did not.
require_first_name: false

# WHAT THIS NICHE SCRAPES
# Energy-intensive German commercial businesses (KMU/Gewerbe) whose annual
# electricity use is >= 30.000 kWh (manufacturing, metal/plastics, food
# production, cold storage, logistics, large bakeries/hotels/retail, print,
# foundries), located within ~100 km of Neuss/Düsseldorf (NRW: Düsseldorf,
# Neuss, Köln, Mönchengladbach, Krefeld, Duisburg, Essen, Wuppertal, Aachen,
# Bonn, Leverkusen, Remscheid, Solingen). The decision-maker is the
# Geschäftsführer / Inhaber / Prokurist — German Impressum + Kontakt pages
# carry that person's name + email + city by law, so this is the reliable
# extraction surface (same pattern that works for the Swiss/DE niches).
#
# DELIBERATELY OUT OF ICP (would need a different pitch first): energy vendors,
# Stadtwerke/utilities, energy consultancies/competitors, pure offices/agencies
# with tiny consumption, private households.
#
# RUN
#   py sequences/lead_scrape.py run energ_gewerbe_nrw
#
# SCHEDULE (daily 08:30 local)
#   schtasks /Create /TN "LES-lead-scrape-energ_gewerbe_nrw" /SC DAILY /ST 08:30 ^
#     /TR "py C:\Users\bernh\local-email-stack\sequences\lead_scrape.py run energ_gewerbe_nrw"

