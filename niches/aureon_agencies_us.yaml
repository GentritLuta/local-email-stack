slug: aureon_agencies_us
name: "US B2B marketing / growth / creative agencies and consultancies (Aureon Global, PRIMARY)"
profile_slug: aureon
engine: team_pages   # httpx + bs4, auto-upgrades to playwright if static HTML is empty

# WHY THIS NICHE (Aureon self-acquisition, primary):
#   - Runs on leads: an agency with no pipeline dies; they buy lead-gen readily.
#   - High-ticket + 40%+ margin: retainers 3-20k/mo, service margins 50-70%.
#   - Sells B2B: their customers are companies, so the free-sample promise
#     (25 verified leads in their exact ICP) is genuinely fulfillable.
#   - Native done-for-you buyers: they already outsource, they get the model.
# Decider: founder / owner / head of growth. require_first_name off to maximise
# yield; enrichment fills names, sequence greeting falls back to "there".

